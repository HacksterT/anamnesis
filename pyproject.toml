[project]
name = "anamnesis"
version = "0.1.0"
description = "Knowledge management framework for LLM agent systems"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8.0", "ruff>=0.11", "httpx>=0.28"]

[project.scripts]
anamnesis = "anamnesis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anamnesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

# Security floors for transitive packages. Upper bounds stop the resolver
# from jumping to later minors whose changelogs were not part of this fix.
# certifi uses calendar versions; 2026.10.23 includes the 2026.10.18 emSign removal.
[tool.uv]
constraint-dependencies = [
    "anyio>=4.14.2,<4.15",
    "certifi>=2026.10.23",
    "idna>=3.15,<3.16",
    "starlette>=1.3.1,<1.4",
]
